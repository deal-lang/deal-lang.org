name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions (T-4-17 mitigation: no PAT stored; OIDC id-token for deploy-pages).
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. Do not cancel in-progress deployments so
# a running deploy finishes cleanly if a new push comes in.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Astro
        # withastro/action@v6 handles: node install, npm ci, astro build, and
        # uploads the dist/ directory as a GitHub Pages artifact.
        # No adapter package needed for static GitHub Pages output.
        # public/CNAME is copied to dist/CNAME automatically by Astro (Pitfall 7).
        uses: withastro/action@v6

      # D-65 parse gate + UI-SPEC §Shiki Scope Gate (Plan 08)
      # Downloads the deal binary from GitHub Releases, runs check-snippets.sh:
      #   1. Extracts every deal/dealx fenced block (skips error-expected blocks)
      #   2. Runs `deal parse` on each snippet — build fails on parse error
      #   3. Scans dist/ HTML for deal/dealx blocks with zero highlighted tokens
      #      (zero styled spans = Shiki grammar not loaded = build fails)
      - name: Download deal binary
        run: |
          DEAL_VERSION="v0.4.0"
          DEAL_URL="https://github.com/deal-lang/deal/releases/download/${DEAL_VERSION}/deal-linux-x86_64.tar.gz"
          curl -sSL "$DEAL_URL" | tar xz -C /usr/local/bin deal
          chmod +x /usr/local/bin/deal
          deal --version

      - name: Snippet parse gate + Shiki scope gate
        run: |
          DEAL_BIN=/usr/local/bin/deal bash scripts/check-snippets.sh

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
